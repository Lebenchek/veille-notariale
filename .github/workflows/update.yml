name: Veille notariale
on:
  schedule:
    - cron: "0 5 * * *"          # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Jours à couvrir pour les nouveautés (45 par défaut)"
        required: false
        default: "45"
      ai_batch:
        description: "Nombre maximum de fiches IA générées ce run (40 par défaut)"
        required: false
        default: "40"
      ai_time_budget:
        description: "Temps maximum alloué aux fiches IA, en secondes (900 par défaut)"
        required: false
        default: "900"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '45' }}
          AI_BATCH: ${{ github.event.inputs.ai_batch || '40' }}
          AI_TIME_BUDGET_S: ${{ github.event.inputs.ai_time_budget || '900' }}
      - run: |
          git config user.name "veille-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Mise à jour $(date -u +%F)"
          git push
